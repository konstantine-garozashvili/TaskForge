name: CD

on:
  push:
    tags:
      - 'v*'

jobs:
  deploy-frontend:
    name: Deploy frontend to Vercel (production)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel environment (production)
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build project
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy to Vercel (production)
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}

  deploy-backend:
    name: Deploy backend to Railway (production)
    runs-on: ubuntu-latest
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm install --global @railway/cli

      - name: Record previous deployment
        run: >-
          echo "PREV_ID=$(railway deployment list
          --project c40bd341-5a3a-4e2d-ae2c-4b2f5bc52402
          --environment production --service backend --json
          | jq -r '.[0].id')" >> "$GITHUB_ENV"

      - name: Link Railway project
        run: >-
          railway link
          --project c40bd341-5a3a-4e2d-ae2c-4b2f5bc52402
          --environment production
          --service backend

      - name: Deploy backend to Railway
        run: >-
          railway up
          --detach --ci
          --message "release ${{ github.ref_name }}"

      - name: Wait for Railway deployment to succeed
        run: |
          for i in $(seq 1 60); do
            ROW=$(railway deployment list \
              --project c40bd341-5a3a-4e2d-ae2c-4b2f5bc52402 \
              --environment production --service backend --json | jq -r '.[0]')
            ID=$(echo "$ROW" | jq -r '.id')
            ST=$(echo "$ROW" | jq -r '.status')
            if [ "$ID" != "$PREV_ID" ]; then
              echo "new deployment $ID status=$ST"
              [ "$ST" = "SUCCESS" ] && exit 0
              case "$ST" in FAILED|CRASHED|REMOVED) exit 1;; esac
            fi
            sleep 10
          done
          echo "timeout waiting for Railway deployment"
          exit 1

      - name: Health check
        run: >-
          curl -sf https://backend-production-d4bd5.up.railway.app/health
          | grep -q '"status":"ok"'

name: CD

on:
  push:
    tags:
      - 'v*'

jobs:
  deploy-frontend:
    name: Deploy frontend to Vercel (production)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel environment (production)
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build project
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy to Vercel (production)
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}

  deploy-backend:
    name: Deploy backend to Railway (production)
    runs-on: ubuntu-latest
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm install --global @railway/cli

      - name: Deploy backend to Railway
        run: >-
          railway up ./backend --path-as-root
          --project c40bd341-5a3a-4e2d-ae2c-4b2f5bc52402
          --environment production
          --service backend
          --detach --ci
          --message "release ${{ github.ref_name }}"

      - name: Wait for backend health
        run: |
          for i in $(seq 1 36); do
            if curl -sf https://backend-production-d4bd5.up.railway.app/health | grep -q '"status":"ok"'; then
              echo "backend healthy"
              exit 0
            fi
            sleep 10
          done
          echo "backend did not become healthy in time"
          exit 1

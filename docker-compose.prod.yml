# TaskForge — stack de production dockerisée (CDC §8)
#
# Lancement :  docker compose -f docker-compose.prod.yml up -d --build --scale backend=3
# Accès :      http://localhost (Traefik) — dashboard Traefik : http://localhost:8080
# Monitoring : Prometheus http://localhost:9090 — Grafana http://localhost:3001 (admin/admin)
#
# Traefik route /api, /health, /metrics vers le backend (load balancé entre
# les réplicas) et / vers le frontend. Aucun secret dans les images :
# les variables sont injectées au runtime (surchargeables via .env ou shell).

services:
  traefik:
    image: traefik:v3.6
    container_name: taskforge-prod-traefik
    restart: unless-stopped
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
      - --api.dashboard=true
      - --api.insecure=true # démo locale uniquement — jamais en prod exposée
      - --accesslog=true
      - --ping=true
      # Métriques Prometheus de Traefik (trafic du load balancer) — entrypoint dédié
      - --entrypoints.metrics.address=:8082
      - --metrics.prometheus=true
      - --metrics.prometheus.entrypoint=metrics
    environment:
      # Docker Engine 29 exige une API >= 1.40 ; le client de Traefik v3.4 négocie trop bas
      DOCKER_API_VERSION: "1.44"
    ports:
      - "80:80"
      - "8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  frontend:
    build:
      context: ./frontend
      args:
        # Même origine via Traefik : le navigateur appelle /api sur le même host
        VITE_API_URL: /api
    restart: unless-stopped
    labels:
      - traefik.enable=true
      - traefik.http.routers.frontend.rule=PathPrefix(`/`)
      - traefik.http.services.frontend.loadbalancer.server.port=8080
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 5000
      LOG_FILE: /app/logs/backend.log # volume partagé logs_data (centralisation §6)
      DATABASE_URL: postgres://taskforge:${POSTGRES_PASSWORD:-taskforge_prod_password}@db:5432/taskforge
      JWT_SECRET: ${JWT_SECRET:-taskforge-prod-secret-change-me}
      CLIENT_URL: ${CLIENT_URL:-http://localhost}
    volumes:
      # Logs JSON centralisés de tous les réplicas (CDC §6)
      - logs_data:/app/logs
    labels:
      - traefik.enable=true
      - traefik.http.routers.backend.rule=PathPrefix(`/api`) || Path(`/health`) || Path(`/metrics`)
      - traefik.http.services.backend.loadbalancer.server.port=5000
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5000/health"]
      interval: 10s
      timeout: 3s
      retries: 5
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    container_name: taskforge-prod-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: taskforge
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-taskforge_prod_password}
      POSTGRES_DB: taskforge
    volumes:
      - db_prod_data:/var/lib/postgresql/data
      # Schéma Merise (MPD) exécuté une seule fois au 1er démarrage
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taskforge -d taskforge"]
      interval: 5s
      timeout: 3s
      retries: 10

  prometheus:
    image: prom/prometheus:v3.4.2
    container_name: taskforge-prod-prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      backend:
        condition: service_started
      traefik:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9090/-/healthy || exit 1"]
      interval: 15s
      timeout: 3s
      retries: 5

  grafana:
    image: grafana/grafana:12.0.2
    container_name: taskforge-prod-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3001:3000"
    depends_on:
      prometheus:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health || exit 1"]
      interval: 15s
      timeout: 3s
      retries: 5

volumes:
  db_prod_data:
  logs_data:
  prometheus_data:
  grafana_data:

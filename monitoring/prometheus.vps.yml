# Prometheus — variante VPS (pas de Traefik sur le VPS : Nginx hôte).
# Scrape uniquement le backend TaskForge.

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: taskforge-backend
    metrics_path: /metrics
    static_configs:
      - targets: ["backend:5000"]
        labels:
          app: taskforge

# Prometheus — variante VPS.
# 1. Métriques réelles du backend TaskForge (/metrics)
# 2. Sondes blackbox (uptime/latence) pour TOUS les projets du VPS

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: taskforge-backend
    metrics_path: /metrics
    static_configs:
      - targets: ["backend:5000"]
        labels:
          app: taskforge

  # Sondes HTTP externes — ajouter un projet = ajouter une URL ici
  - job_name: vps-sites
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - https://konstantine.fr
          - https://konstantine.fr/api/health
          - https://taskforge.konstantine.fr
          - https://taskforge.konstantine.fr/api
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115

# Provisioning des dashboards Grafana — charge monitoring/grafana/dashboards/*.json
apiVersion: 1

providers:
  - name: taskforge
    orgId: 1
    folder: ""
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false

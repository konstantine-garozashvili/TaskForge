# TaskForge — site Nginx HÔTE (à installer dans /etc/nginx/sites-available/taskforge)
# TLS géré par certbot : sudo certbot --nginx -d taskforge.konstantine.fr
# Chaîne : Nginx (TLS) → Traefik 127.0.0.1:8081 → backend / frontend (Docker).
# Traefik fait le dispatch /api → backend, / → SPA, et expose ses métriques
# à Prometheus (panneau Traefik du dashboard Grafana).

server {
    listen 80;
    server_name taskforge.konstantine.fr;

    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

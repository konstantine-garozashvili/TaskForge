# TaskForge — site Nginx HÔTE (à installer dans /etc/nginx/sites-available/taskforge)
# TLS géré par certbot : sudo certbot --nginx -d taskforge.konstantine.fr
# Le frontend (SPA) tourne sur 127.0.0.1:8080, le backend sur 127.0.0.1:5001.

server {
    listen 80;
    server_name taskforge.konstantine.fr;

    # API backend (inclut /api-docs Swagger et /api-docs.json)
    location /api {
        proxy_pass http://127.0.0.1:5001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Santé et métriques backend (monitoring externe éventuel)
    location = /health {
        proxy_pass http://127.0.0.1:5001;
    }

    # SPA : tout le reste va au frontend (qui gère son fallback index.html)
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
